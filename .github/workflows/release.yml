name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Validate, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        run: npm run release:check
      - run: npm ci
      - run: npm test
      - name: Package the Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist/chrome && zip -q -r "$GITHUB_WORKSPACE/release/tabsaver-chrome-${RELEASE_TAG}.zip" .)
          cd release
          sha256sum "tabsaver-chrome-${RELEASE_TAG}.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - name: Publish release and attach files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release/tabsaver-chrome-${RELEASE_TAG}.zip" \
            release/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "TabSaver ${RELEASE_TAG}" \
            --generate-notes \
            --notes 'Para instalar no Chrome, baixe o arquivo tabsaver-chrome desta release, extraia o ZIP e carregue a pasta em chrome://extensions usando Carregar sem compactação. Consulte o README para instruções completas. Os arquivos Source code são o código-fonte e precisam ser compilados.'
